<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Katalog Produk — Nine Autogarage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" rel="stylesheet"/>
  <link href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" rel="stylesheet"/>
  <link href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/config.js"></script>
  <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/base.css"/>
</head>
<body data-tab="mall" data-search="off" data-title="Katalog Produk" class="bg-surface font-body text-body text-on-surface antialiased">
<main class="max-w-md mx-auto min-h-screen pt-16 pb-24 bg-surface text-on-surface flex flex-col relative">

  <!-- Search & Filter Controls -->
  <section class="px-4 pt-3 pb-2">
    <!-- Search Input -->
    <div class="relative w-full">
      <i class="ph-bold ph-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-neutral-400 text-base"></i>
      <input id="catalogSearch" oninput="filterProducts()" placeholder="Cari tipe socket, biled, watt..." class="w-full h-11 pl-10 pr-9 rounded-xl bg-white border border-neutral-200/80 text-xs font-semibold text-primary-950 placeholder-neutral-400 outline-none focus:border-primary-900 shadow-2xs"/>
      <button onclick="document.getElementById('catalogSearch').value='';filterProducts();" class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-400 hover:text-neutral-700">
        <i class="ph-bold ph-x text-xs"></i>
      </button>
    </div>

    <!-- Filter Bar Horizontal Chips -->
    <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-2.5">
      <button onclick="openFilterSheet()" class="tap-44 h-9 px-3.5 rounded-full bg-primary-950 text-white font-bold text-xs flex items-center gap-1.5 shadow-xs shrink-0 ios-press">
        <i class="ph-bold ph-funnel text-xs"></i>Filter
      </button>
      <button onclick="setFilterCategory('all', this)" class="cat-chip tap-44 h-9 px-3.5 rounded-full bg-accent-50 text-accent-700 border border-accent-200 font-bold text-xs shrink-0">
        Semua
      </button>
      <button onclick="setFilterCategory('biled', this)" class="cat-chip tap-44 h-9 px-3.5 rounded-full bg-white border border-neutral-200/80 text-neutral-700 font-semibold text-xs shrink-0">
        Biled
      </button>
      <button onclick="setFilterCategory('laser', this)" class="cat-chip tap-44 h-9 px-3.5 rounded-full bg-white border border-neutral-200/80 text-neutral-700 font-semibold text-xs shrink-0">
        Lampu Tembak
      </button>
      <button onclick="setFilterCategory('horn', this)" class="cat-chip tap-44 h-9 px-3.5 rounded-full bg-white border border-neutral-200/80 text-neutral-700 font-semibold text-xs shrink-0">
        Klakson
      </button>
      <button onclick="setFilterCategory('relay', this)" class="cat-chip tap-44 h-9 px-3.5 rounded-full bg-white border border-neutral-200/80 text-neutral-700 font-semibold text-xs shrink-0">
        Relay Set
      </button>
      <button onclick="setFilterCategory('nmax', this)" class="cat-chip tap-44 h-9 px-3.5 rounded-full bg-white border border-neutral-200/80 text-neutral-700 font-semibold text-xs shrink-0">
        NMAX
      </button>
    </div>

    <!-- Results metadata -->
    <div class="flex items-center justify-between text-xs text-neutral-500 pb-1">
      <span>Menampilkan <b class="text-primary-950" id="resultCount">8</b> produk resmi</span>
      <span class="font-medium text-[11px] text-accent-700">Gudang Jakarta Barat</span>
    </div>
  </section>

  <!-- 2-Column Product Grid -->
  <section class="px-4">
    <div class="grid grid-cols-2 gap-3" id="catalogGrid">
      <!-- Injected via JS -->
    </div>
  </section>

</main>

<!-- Bottom Sheet: Filter Lengkap (Per Frontend-Mall ProductMobileFilterDrawer.vue) -->
<div id="filterSheet" class="hidden fixed inset-0 z-[70] bg-black/40 backdrop-blur-xs flex items-end justify-center">
  <div class="w-full max-w-md bg-white rounded-t-3xl p-5 pb-8 shadow-2xl translate-y-full transition-transform duration-300 max-h-[88vh] overflow-y-auto" id="filterBody">
    <div data-sheet-handle class="ios-sheet-handle"></div>
    <div class="flex items-center justify-between pb-3 border-b border-neutral-100">
      <h3 class="font-headline text-lg font-bold text-primary-950">Filter Produk</h3>
      <button onclick="closeFilterSheet()" class="tap-44 text-neutral-400 hover:text-neutral-700">
        <i class="ph-bold ph-x text-lg"></i>
      </button>
    </div>

    <!-- Kategori Selection -->
    <div class="mt-4">
      <label class="font-bold text-[11px] uppercase tracking-wider text-neutral-500 block mb-2">KATEGORI</label>
      <div class="grid grid-cols-2 gap-2">
        <button class="sheet-filter-cat py-2.5 px-3 rounded-xl border-2 border-accent-500 bg-accent-50 font-bold text-xs text-accent-800 text-left">Biled Projector</button>
        <button class="sheet-filter-cat py-2.5 px-3 rounded-xl border border-neutral-200 bg-neutral-50 font-semibold text-xs text-neutral-700 text-left">Lampu Tembak Miniprojie</button>
        <button class="sheet-filter-cat py-2.5 px-3 rounded-xl border border-neutral-200 bg-neutral-50 font-semibold text-xs text-neutral-700 text-left">Klakson Keong</button>
        <button class="sheet-filter-cat py-2.5 px-3 rounded-xl border border-neutral-200 bg-neutral-50 font-semibold text-xs text-neutral-700 text-left">Relay Harness</button>
      </div>
    </div>

    <!-- Rentang Harga -->
    <div class="mt-5">
      <label class="font-bold text-[11px] uppercase tracking-wider text-neutral-500 block mb-2">RENTANG HARGA (RP)</label>
      <div class="flex items-center gap-2">
        <input type="text" value="100.000" class="flex-1 h-11 px-3 rounded-xl bg-neutral-50 border border-neutral-200 text-xs font-semibold text-primary-950"/>
        <span class="text-neutral-400 font-bold">-</span>
        <input type="text" value="3.000.000" class="flex-1 h-11 px-3 rounded-xl bg-neutral-50 border border-neutral-200 text-xs font-semibold text-primary-950"/>
      </div>
    </div>

    <!-- Kompatibel Kendaraan -->
    <div class="mt-5">
      <label class="font-bold text-[11px] uppercase tracking-wider text-neutral-500 block mb-2">KOMPATIBILITAS KENDARAAN</label>
      <div class="grid grid-cols-3 gap-2">
        <button class="py-2.5 rounded-xl border-2 border-accent-500 bg-accent-50 font-bold text-xs text-accent-800">Semua</button>
        <button class="py-2.5 rounded-xl border border-neutral-200 bg-neutral-50 font-semibold text-xs text-neutral-700">Motor (NMAX, PCX)</button>
        <button class="py-2.5 rounded-xl border border-neutral-200 bg-neutral-50 font-semibold text-xs text-neutral-700">Mobil (SUV, Sedan)</button>
      </div>
    </div>

    <!-- Urutan -->
    <div class="mt-5">
      <label class="font-bold text-[11px] uppercase tracking-wider text-neutral-500 block mb-2">URUTKAN BERDASARKAN</label>
      <div class="grid grid-cols-2 gap-2">
        <button class="py-2.5 rounded-xl border-2 border-accent-500 bg-accent-50 font-bold text-xs text-accent-800">Terlaris</button>
        <button class="py-2.5 rounded-xl border border-neutral-200 bg-neutral-50 font-semibold text-xs text-neutral-700">Harga Terendah</button>
        <button class="py-2.5 rounded-xl border border-neutral-200 bg-neutral-50 font-semibold text-xs text-neutral-700">Harga Tertinggi</button>
        <button class="py-2.5 rounded-xl border border-neutral-200 bg-neutral-50 font-semibold text-xs text-neutral-700">Ulasan Tertinggi</button>
      </div>
    </div>

    <!-- Footer Actions -->
    <div class="grid grid-cols-2 gap-2 mt-6 pt-3 border-t border-neutral-100">
      <button onclick="closeFilterSheet()" class="h-11 rounded-xl bg-neutral-100 text-primary-950 font-bold text-xs ios-press">Reset</button>
      <button onclick="closeFilterSheet();window.nineToast('Filter diterapkan (8 produk)','funnel');" class="h-11 rounded-xl bg-accent-600 hover:bg-accent-700 text-white font-bold text-xs uppercase tracking-wider shadow-xs ios-press active:scale-95 transition-all">Terapkan</button>
    </div>
  </div>
</div>

<script src="assets/shell.js"></script>

    { id: 8, title: "Voltmeter Digital & USB Fast Charging Nine", price: "Rp 85.000", original: "Rp 115.000", discount: 26, cashback: "+850 Koin", rating: "4.9", sold: "1,8rb", type: "AKSESORI", cat: "nmax", img: "https://lh3.googleusercontent.com/aida-public/AB6AXuBeoggYWzW8iPuPljVfCEhSrIokJ0EDmsTt0IXJiIeEd5tSfUe4iXyWGVZtkESdcetPaFXJiHmI7o_0fBcivey6WBr317s0pbyYEoEEROMLle-l3FPuCcpkCk4udBrj6dv3R5fTuu6c60GUnRGN11E4PLwWdwkFxudCfLFrq6YyVPPlqyescxeF869MbByFvqTFhJGLbP62Qd2NC60fRWdkmtmMeIT_IlyuFh9hIfVE" }
  ];

  var activeCat = "all";

  function renderGrid(list) {
    document.getElementById("resultCount").textContent = list.length;
    document.getElementById("catalogGrid").innerHTML = list.map(function (p) {
      return '<div class="ios-card p-3 flex flex-col justify-between group hover:border-neutral-300 transition-all">' +
        '<a href="product-detail.html" class="block">' +
        '<div class="relative w-full aspect-square rounded-xl overflow-hidden bg-neutral-100 mb-2">' +
        '<img src="' + p.img + '" alt="' + p.title + '" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"/>' +
        (p.discount > 0 ? '<span class="absolute top-2 left-2 rounded-lg bg-rose-500 text-white font-black text-[9.5px] px-2 py-0.5 uppercase shadow-xs">-' + p.discount + '%</span>' : '') +
        '<span class="absolute top-2 right-2 rounded-md bg-white/90 backdrop-blur-xs px-1.5 py-0.5 font-micro text-[8px] font-bold text-primary-950 uppercase">' + p.type + '</span>' +
        '</div>' +
        '<div class="flex items-center gap-1 mb-1">' +
        '<i class="ph-fill ph-star text-amber-400 text-xs"></i><span class="text-xs font-bold text-primary-950">' + p.rating + '</span>' +
        '<span class="text-[10px] text-neutral-400">(' + p.sold + ')</span>' +
        '</div>' +
        '<h3 class="font-bold text-xs text-primary-950 line-clamp-2 leading-tight">' + p.title + '</h3>' +
        (p.cashback ? '<div class="mt-1"><span class="badge-koin text-[9.5px]">🪙 ' + p.cashback + '</span></div>' : '') +
        '</a>' +
        '<div class="mt-2 pt-2 border-t border-neutral-100 flex items-center justify-between">' +
        '<div>' +
        '<span class="font-price text-sm font-black text-primary-950 block">' + p.price + '</span>' +
        (p.original ? '<span class="text-[10px] text-neutral-400 line-through">' + p.original + '</span>' : '') +
        '</div>' +
        '<button onclick="quickAdd(\'' + p.title + '\')" aria-label="Tambah" class="tap-44 w-8 h-8 rounded-xl bg-accent-600 hover:bg-accent-700 text-white flex items-center justify-center transition-all shadow-xs active:scale-95 ios-press">' +
        '<i class="ph-bold ph-plus text-sm"></i>' +
        '</button>' +
        '</div>' +
        '</div>';
    }).join("");
  }

  function setFilterCategory(cat, btn) {
    activeCat = cat;
    document.querySelectorAll(".cat-chip").forEach(function (b) {
      b.className = "cat-chip tap-44 h-9 px-3.5 rounded-full bg-white border border-neutral-200/80 text-neutral-700 font-semibold text-xs shrink-0";
    });
    btn.className = "cat-chip tap-44 h-9 px-3.5 rounded-full bg-accent-600 text-white font-bold text-xs shadow-xs shrink-0";
    filterProducts();
  }

  function filterProducts() {
    var q = document.getElementById("catalogSearch").value.toLowerCase();
    var filtered = PRODUCTS.filter(function (p) {
      var matchCat = activeCat === "all" || p.cat === activeCat;
      var matchQuery = !q || p.title.toLowerCase().indexOf(q) !== -1 || p.type.toLowerCase().indexOf(q) !== -1;
      return matchCat && matchQuery;
    });
    renderGrid(filtered);
  }

  function quickAdd(name) {
    var c = parseInt(localStorage.getItem("nine_cart") || "2", 10) + 1;
    nineCartSet(c);
    window.nineToast(name + " dimasukkan ke keranjang", "shopping-bag");
  }

  // Filter Sheet Logic
  var filterSheet = document.getElementById("filterSheet");
  var filterBody = document.getElementById("filterBody");

  function openFilterSheet() {
    filterSheet.classList.remove("hidden");
    requestAnimationFrame(function () {
      filterBody.classList.remove("translate-y-full");
    });
  }

  function closeFilterSheet() {
    filterBody.classList.add("translate-y-full");
    setTimeout(function () {
      filterSheet.classList.add("hidden");
    }, 280);
  }

  filterSheet.addEventListener("click", function (e) {
    if (e.target === filterSheet) closeFilterSheet();
  });

  renderGrid(PRODUCTS);
</script>
</body>
</html>
