# SonarQube Configuration for Nine Apps Mobile Ecosystem
# Clean Code Standards & DRY Maintainability

sonar.projectKey=nine-apps-mobile
sonar.projectName=Nine Apps Mobile Ecosystem
sonar.projectVersion=3.8.4

# Source files and inclusions
sonar.sources=.
sonar.inclusions=**/*.html,**/*.js,**/*.css
sonar.exclusions=**/*.test*,**/*.spec*,node_modules/**,dist/**,coverage/**,.git/**,.shots/**

# Source encoding
sonar.sourceEncoding=UTF-8

# Web & JavaScript Specific Rules
sonar.javascript.environments=browser
sonar.html.file.suffixes=.html,.htm

# Clean Code Quality Gate configurations
sonar.qualitygate.wait=false
sonar.cpd.exclusions=**/*.test*,assets/config.js

# Issue filtering for modern single-file mobile prototyping
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:AvoidInlineStyle
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.html
