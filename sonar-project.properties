# SonarQube Project Configuration — Nine AutoSeries Super-App
# Referensi SOP: docs/Agents.md (Seksi 3.9 Security & SonarQube Analysis)
# Jalankan dengan: sonar-scanner -Dsonar.token=<SONAR_TOKEN>
sonar.projectKey=nine-autoseries-mobile
sonar.projectName=Nine AutoSeries Mobile App (Flutter)
sonar.projectVersion=1.0.0

sonar.host.url=http://localhost:9000
sonar.token=sqa_scanner_token_nine_garage_2026

sonar.sources=lib
sonar.tests=test
sonar.sourceEncoding=UTF-8
sonar.scm.disabled=true

# Exclude generated/external directories
sonar.exclusions=build/**,.dart_tool/**,pedoman_Apps/**,android/**,ios/**,web/**,windows/**,macos/**,linux/**,.scannerwork/**,coverage/**

# LCOV Coverage Report (generated via: flutter test --coverage)
sonar.dart.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.g.dart,**/*.freezed.dart,lib/main.dart

# Use project's own analysis_options.yaml
sonar.dart.analysis.useExistingOptions=true
