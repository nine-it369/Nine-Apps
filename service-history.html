<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Riwayat Servis — Nine Autogarage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" rel="stylesheet"/>
  <link href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/config.js"></script>
  <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/base.css"/>
</head>
<body data-tab="booking" class="bg-surface font-body text-body text-on-surface flex flex-col antialiased selection:bg-accent-subtle selection:text-accent-text" data-search="off" data-title="Riwayat Servis Bengkel">

<main class="w-full max-w-md mx-auto pt-16 pb-28 min-h-screen px-4 flex flex-col">

  <!-- Overview Stats Metric (Apple HIG Inset Grouped) -->
  <section class="mt-2 ios-card p-3.5 shadow-sm">
    <div class="grid grid-cols-3 divide-x divide-primary-100 text-center">
      <div class="px-2">
        <span class="font-headline text-display text-on-surface font-bold block">11</span>
        <span class="font-micro text-micro uppercase tracking-wider text-secondary">Total Servis</span>
      </div>
      <div class="px-2">
        <span class="font-headline text-display text-accent-text font-bold block">9</span>
        <span class="font-micro text-micro uppercase tracking-wider text-secondary">Selesai</span>
      </div>
      <div class="px-2">
        <span class="font-headline text-display text-warning-text font-bold block">2</span>
        <span class="font-micro text-micro uppercase tracking-wider text-secondary">Sedang Proses</span>
      </div>
    </div>
  </section>

  <!-- Filter Chips Bar -->
  <div class="mt-3.5 flex gap-1.5 overflow-x-auto pb-1" id="filterBar">
    <button onclick="applyFilter('all', this)" class="hist-filt px-3.5 py-1.5 rounded-full bg-primary-900 text-white font-body-semibold text-caption shadow-sm shrink-0">
      Semua (11)
    </button>
    <button onclick="applyFilter('in_progress', this)" class="hist-filt px-3.5 py-1.5 rounded-full bg-surface-card border border-primary-200 text-on-surface font-body-semibold text-caption shadow-sm shrink-0">
      Sedang Berjalan (2)
    </button>
    <button onclick="applyFilter('completed', this)" class="hist-filt px-3.5 py-1.5 rounded-full bg-surface-card border border-primary-200 text-on-surface font-body-semibold text-caption shadow-sm shrink-0">
      Selesai (8)
    </button>
    <button onclick="applyFilter('cancelled', this)" class="hist-filt px-3.5 py-1.5 rounded-full bg-surface-card border border-primary-200 text-on-surface font-body-semibold text-caption shadow-sm shrink-0">
      Dibatalkan (1)
    </button>
  </div>

  <!-- History Items List -->
  <section class="mt-3.5 flex flex-col gap-3" id="historyList">
    <!-- Populated via JS -->
  </section>

</main>

<script src="assets/shell.js"></script>
<script>
  var RECORDS = [
    {
      id: "TGR-8821-2026",
      date: "11 Okt 2026",
      service: "Retrofit Biled Matrix E9 Pro + Kalibrasi Beam",
      branch: "Nine Garage Arcadia BSD (Pit 02)",
      vehicle: "Yamaha NMAX 155 · B 1234 XYZ",
      cost: "Rp 325.000",
      status: "in_progress",
      statusLabel: "Sedang Berjalan",
      badgeClass: "bg-warning-subtle text-warning-text",
      icon: "wrench"
    },
    {
      id: "TGR-7990-2026",
      date: "22 Sep 2026",
      service: "Ganti Oli Motul 10W-40 + Filter Udara",
      branch: "Nine Garage Arcadia BSD",
      vehicle: "Yamaha NMAX 155 · B 1234 XYZ",
      cost: "Rp 95.000",
      status: "completed",
      statusLabel: "Selesai",
      badgeClass: "bg-accent-subtle text-accent-text",
      icon: "check-circle"
    },
    {
      id: "TGR-7712-2026",
      date: "04 Agu 2026",
      service: "Penggantian Kampas Rem Depan Bendix Ceramic",
      branch: "Nine Garage Jelambar",
      vehicle: "Yamaha NMAX 155 · B 1234 XYZ",
      cost: "Rp 180.000",
      status: "completed",
      statusLabel: "Selesai",
      badgeClass: "bg-accent-subtle text-accent-text",
      icon: "check-circle"
    },
    {
      id: "TGR-7401-2026",
      date: "18 Jun 2026",
      service: "Instalasi Klakson Waterproof Denso 118dB + Relay",
      branch: "Nine Garage Jelambar",
      vehicle: "Yamaha NMAX 155 · B 1234 XYZ",
      cost: "Rp 210.000",
      status: "completed",
      statusLabel: "Selesai",
      badgeClass: "bg-accent-subtle text-accent-text",
      icon: "check-circle"
    },
    {
      id: "TGR-7210-2026",
      date: "29 Apr 2026",
      service: "Instalasi GPS Tracker 4G IoT Antimaling",
      branch: "Nine Garage Arcadia BSD",
      vehicle: "Yamaha NMAX 155 · B 1234 XYZ",
      cost: "Rp 75.000",
      status: "cancelled",
      statusLabel: "Dibatalkan",
      badgeClass: "bg-danger-subtle text-danger-text",
      icon: "prohibit"
    },
    {
      id: "TGR-6988-2026",
      date: "11 Mar 2026",
      service: "Tune Up Lengkap CVT & Pembersihan Throttle Body",
      branch: "Nine Garage Arcadia BSD",
      vehicle: "Yamaha NMAX 155 · B 1234 XYZ",
      cost: "Rp 450.000",
      status: "completed",
      statusLabel: "Selesai",
      badgeClass: "bg-accent-subtle text-accent-text",
      icon: "check-circle"
    }
  ];

  function renderHistory(filter) {
    var filtered = RECORDS.filter(function(r) {
      if (!filter || filter === 'all') return true;
      return r.status === filter;
    });

    var container = document.getElementById("historyList");
    if (!filtered.length) {
      container.innerHTML = '<div class="text-center py-12 ios-card p-6">' +
        '<i class="ph ph-wrench text-4xl text-secondary mb-2 block"></i>' +
        '<h4 class="font-headline text-caption font-bold text-on-surface">Tidak ada riwayat servis</h4>' +
        '<p class="font-caption text-caption text-secondary mt-0.5">Belum ada catatan servis pada kategori ini.</p>' +
      '</div>';
      return;
    }

    container.innerHTML = filtered.map(function(r) {
      return '<div class="ios-card p-4 shadow-sm flex flex-col gap-2.5 active:bg-primary-50/50 transition-colors">' +
        '<div class="flex items-center justify-between">' +
          '<div class="flex items-center gap-2">' +
            '<span class="font-mono text-caption font-bold text-primary-900">' + r.id + '</span>' +
            '<span class="font-caption text-[11px] text-secondary">• ' + r.date + '</span>' +
          '</div>' +
          '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full font-micro text-micro font-bold uppercase tracking-wider ' + r.badgeClass + '">' +
            '<i class="ph-bold ph-' + r.icon + ' text-xs"></i>' + r.statusLabel +
          '</span>' +
        '</div>' +
        '<div>' +
          '<h3 class="font-body-semibold text-caption text-on-surface font-bold">' + r.service + '</h3>' +
          '<p class="font-caption text-caption text-secondary mt-0.5">' + r.branch + '</p>' +
          '<p class="font-micro text-micro text-secondary font-mono mt-0.5">' + r.vehicle + '</p>' +
        '</div>' +
        '<div class="h-px bg-primary-100"></div>' +
        '<div class="flex items-center justify-between pt-0.5">' +
          '<div>' +
            '<span class="font-micro text-micro uppercase text-secondary block">Biaya Jasa & Part</span>' +
            '<span class="font-headline text-caption font-bold font-mono text-primary-900">' + r.cost + '</span>' +
          '</div>' +
          '<div class="flex items-center gap-2">' +
            '<button onclick="nineToast(\'Mengunduh E-Invoice PDF ' + r.id + '...\',\'file-arrow-down\')" class="px-2.5 py-1.5 rounded-lg bg-primary-100 font-micro text-micro font-bold text-primary-900 active:bg-primary-200 transition-colors">' +
              'Invoice PDF' +
            '</button>' +
            '<a href="booking-detail.html" class="px-3 py-1.5 rounded-lg bg-primary-900 text-white font-micro text-micro font-bold active:bg-primary-800 transition-colors shadow-xs">' +
              'Detail Tiket' +
            '</a>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join("");
  }

  function applyFilter(filter, btn) {
    document.querySelectorAll(".hist-filt").forEach(function(b) {
      b.className = "hist-filt px-3.5 py-1.5 rounded-full bg-surface-card border border-primary-200 text-on-surface font-body-semibold text-caption shadow-sm shrink-0";
    });
    btn.className = "hist-filt px-3.5 py-1.5 rounded-full bg-primary-900 text-white font-body-semibold text-caption shadow-sm shrink-0";
    renderHistory(filter);
  }

  renderHistory('all');
</script>
</body>
</html>
