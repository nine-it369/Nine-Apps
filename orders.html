<body data-tab="mall" data-search="off" data-title="Pesanan Saya" class="bg-surface font-body text-body text-on-surface antialiased">
<main class="max-w-md mx-auto min-h-screen pt-16 pb-24 bg-surface text-on-surface flex flex-col relative">

  <!-- Header Summary & Quick Track -->
  <div class="px-4 pt-3 pb-1 flex items-center justify-between">
    <div>
      <h1 class="font-headline text-lg font-black tracking-tight text-primary-950">Daftar Transaksi</h1>
      <p class="text-xs text-neutral-500">2 pesanan aktif · 4 selesai</p>
    </div>
    <a href="track.html" class="tap-44 h-9 px-3 rounded-full bg-white border border-neutral-200 shadow-2xs font-bold text-xs text-primary-950 flex items-center gap-1.5 ios-press">
      <i class="ph-bold ph-crosshair text-sm"></i>Cek Resi
    </a>
  </div>

  <!-- Segmented Tabs (Horizontal Scrollable) -->
  <div class="px-4 py-2 overflow-x-auto no-scrollbar">
    <div class="flex items-center gap-1.5 w-max">
      <button onclick="switchTab(this,'menunggu')" class="order-tab tap-44 h-9 px-3.5 rounded-full bg-accent-600 text-white font-bold text-xs shadow-xs">
        Menunggu Bayar
      </button>
      <button onclick="switchTab(this,'diproses')" class="order-tab tap-44 h-9 px-3.5 rounded-full bg-white border border-neutral-200/80 text-neutral-600 font-semibold text-xs">
        Diproses
      </button>
      <button onclick="switchTab(this,'dikirim')" class="order-tab tap-44 h-9 px-3.5 rounded-full bg-white border border-neutral-200/80 text-neutral-600 font-semibold text-xs">
        Dikirim
      </button>
      <button onclick="switchTab(this,'selesai')" class="order-tab tap-44 h-9 px-3.5 rounded-full bg-white border border-neutral-200/80 text-neutral-600 font-semibold text-xs">
        Selesai
      </button>
      <button onclick="switchTab(this,'dibatalkan')" class="order-tab tap-44 h-9 px-3.5 rounded-full bg-white border border-neutral-200/80 text-neutral-600 font-semibold text-xs">
        Dibatalkan
      </button>
    </div>
  </div>

  <!-- Orders Cards List -->
  <div class="px-4 flex flex-col gap-3 mt-1 pb-4" id="orderList">
    <!-- Rendered via JS -->
  </div>

</main>

  function renderOrders(tabKey) {
    var list = ORDERS[tabKey] || [];
    var container = document.getElementById("orderList");

    if (!list.length) {
      container.innerHTML =
        '<div class="ios-card p-8 text-center text-neutral-400">' +
        '<i class="ph-bold ph-shopping-bag-open text-4xl mb-2 block mx-auto text-neutral-300"></i>' +
        '<p class="font-bold text-sm text-primary-950">Tidak ada pesanan di status ini</p>' +
        '<p class="text-xs text-neutral-400 mt-0.5">Semua transaksi yang kamu buat akan tersimpan di sini.</p>' +
        '</div>';
      return;
    }

    container.innerHTML = list.map(function (o) {
      return '<div class="ios-card p-4 flex flex-col gap-3">' +
        '<div class="flex items-center justify-between pb-2.5 border-b border-neutral-100">' +
        '<span class="font-mono text-xs font-bold text-primary-950">' + o.id + '</span>' +
        '<span class="px-2 py-0.5 rounded-full border text-[9px] font-black uppercase tracking-wider ' + o.statusTone + '">' + o.status + '</span>' +
        '</div>' +

        '<div class="space-y-2">' +
        o.items.map(function (item) {
          return '<div class="flex items-center gap-3">' +
            '<div class="w-12 h-12 rounded-xl bg-neutral-100 overflow-hidden shrink-0 border border-neutral-100">' +
            '<img src="' + item.img + '" alt="' + item.name + '" class="w-full h-full object-cover"/>' +
            '</div>' +
            '<div class="min-w-0 flex-1">' +
            '<h4 class="font-bold text-xs text-primary-950 truncate">' + item.name + '</h4>' +
            '<span class="text-[11px] text-neutral-500">' + item.qty + ' barang · ' + item.price + '</span>' +
            '</div>' +
            '</div>';
        }).join("") +
        '</div>' +

        (o.countdown ? '<div class="p-2.5 rounded-xl bg-amber-50 text-warning-text text-xs font-bold flex items-center gap-2"><i class="ph-bold ph-timer text-sm"></i>' + o.countdown + '</div>' : '') +
        (o.note ? '<p class="text-xs text-neutral-500 leading-snug"><i class="ph-bold ph-info text-neutral-400 mr-1"></i>' + o.note + '</p>' : '') +

        '<div class="flex items-center justify-between pt-2.5 border-t border-neutral-100">' +
        '<div>' +
        '<span class="text-[10px] text-neutral-400 font-bold uppercase tracking-wider block">TOTAL PESANAN</span>' +
        '<span class="font-price text-sm font-black text-primary-950">' + o.total + '</span>' +
        '</div>' +
        '<a href="' + o.primaryHref + '" class="h-9 px-4 rounded-xl bg-accent-600 hover:bg-accent-700 text-white font-bold text-xs flex items-center justify-center ios-press active:scale-95 transition-all shadow-xs">' + o.primaryCta + '</a>' +
        '</div>' +
        '</div>';
    }).join("");
  }

  function switchTab(btn, key) {
    document.querySelectorAll(".order-tab").forEach(function (b) {
      b.className = "order-tab tap-44 h-9 px-3.5 rounded-full bg-white border border-neutral-200/80 text-neutral-600 font-semibold text-xs";
    });
    btn.className = "order-tab tap-44 h-9 px-3.5 rounded-full bg-accent-600 text-white font-bold text-xs shadow-xs";
    renderOrders(key);
  }

  renderOrders("menunggu");
