<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="biledCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <!-- Outer Housing -->
  <rect x="20" y="22" width="60" height="46" rx="8" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <!-- Inner Projector Lens Body -->
  <circle cx="50" cy="45" r="18" fill="url(#biledCore)" stroke="#0369A1" stroke-width="1.5"/>
  <!-- Glass Reflection Arc -->
  <circle cx="50" cy="45" r="12" stroke="#BAE6FD" stroke-width="1.5" opacity="0.8"/>
  <circle cx="46" cy="41" r="3.5" fill="#FFFFFF"/>
  <!-- Shroud Ring -->
  <circle cx="50" cy="45" r="21" stroke="#475569" stroke-width="2" stroke-dasharray="4 2"/>
  <!-- Connector Pins -->
  <rect x="36" y="68" width="6" height="12" rx="2" fill="#94A3B8"/>
  <rect x="58" y="68" width="6" height="12" rx="2" fill="#94A3B8"/>
</svg>