<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="swGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
  </defs>
  <!-- Outer Bezel -->
  <rect x="24" y="20" width="52" height="60" rx="8" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <!-- Rocker Switch Button -->
  <rect x="30" y="26" width="40" height="48" rx="4" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <!-- Indicator Ring / Power Symbol -->
  <circle cx="50" cy="46" r="12" stroke="url(#swGlow)" stroke-width="2.5"/>
  <line x1="50" y1="38" x2="50" y2="46" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bottom Connector Pins -->
  <rect x="38" y="80" width="6" height="8" rx="2" fill="#94A3B8"/>
  <rect x="56" y="80" width="6" height="8" rx="2" fill="#94A3B8"/>
</svg>
