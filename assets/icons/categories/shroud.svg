<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shroudGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
  </defs>
  <!-- Projector Outer Shroud Body -->
  <circle cx="50" cy="50" r="32" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <!-- Inner Facets / Turbine Styling -->
  <circle cx="50" cy="50" r="26" stroke="#475569" stroke-width="2" stroke-dasharray="6 3"/>
  <!-- Angel Eye / Halo Ring -->
  <circle cx="50" cy="50" r="20" stroke="url(#shroudGlow)" stroke-width="3"/>
  <!-- Central Lens -->
  <circle cx="50" cy="50" r="12" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
  <circle cx="46" cy="46" r="3" fill="#FFFFFF" opacity="0.9"/>
</svg>
