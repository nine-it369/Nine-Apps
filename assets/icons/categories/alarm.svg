<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="alarmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>
  <!-- Remote Key Fob / Siren -->
  <rect x="30" y="24" width="40" height="54" rx="10" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <!-- Key ring loop -->
  <circle cx="50" cy="18" r="6" stroke="#94A3B8" stroke-width="2"/>
  <!-- Lock Button with Red Accent -->
  <circle cx="50" cy="40" r="8" fill="url(#alarmGrad)"/>
  <circle cx="50" cy="40" r="3.5" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- Signal waves -->
  <path d="M42 58 Q 50 54 58 58" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <path d="M38 64 Q 50 58 62 64" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
</svg>
