<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="uiAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <!-- Outer Frame -->
  <rect x="16" y="24" width="68" height="52" rx="7" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <!-- Touchscreen Glass -->
  <rect x="21" y="29" width="58" height="42" rx="4" fill="url(#screenGrad)"/>
  <!-- Dashboard UI elements -->
  <circle cx="36" cy="50" r="10" stroke="url(#uiAccent)" stroke-width="2" stroke-dasharray="14 4"/>
  <circle cx="36" cy="50" r="4" fill="#38BDF8"/>
  <rect x="52" y="38" width="20" height="4" rx="2" fill="#64748B"/>
  <rect x="52" y="46" width="16" height="4" rx="2" fill="#38BDF8"/>
  <rect x="52" y="54" width="12" height="4" rx="2" fill="#818CF8"/>
</svg>
